
services:
  db:
    image: postgres:16-alpine
    container_name: movie_rating_dev 
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: movie_rating_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: movie_rating_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@db:5432/movie_rating_dev
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "poetry run alembic upgrade head &&
             poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
