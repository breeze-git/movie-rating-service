[project]
name = "movie-rating-service"
version = "0.1.0"
description = "My learning FastAPI project"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python =">=3.11,<4.0" 
dependencies = [
    "uvicorn>=0.34.3",
    "fastapi[standard]>=0.115.12",
    "pydantic>=2.11.5",
    "environs>=14.2.0",
    "itsdangerous>=2.2.0",
    "alembic>=1.19.0,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "limits>=5.8.0,<6.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "bcrypt (>=5.0.0,<6.0.0)",
]

[tool.poetry]
name = "movie-rating-service"
version = "0.1.0"
description = "Movie Rating API"
authors = ["breeze-code"]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
polyfactory = "^3.3.0"
httpx = "^0.28.1"
pytest-env = "^1.7.0"
pre-commit = "^4.6.1"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["venv", ".venv", "alembic", "docker", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends"
]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "start:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-vv"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
env = [
	"DATABASE_URL=postgresql+asyncpg://admin:admin@localhost/movie_rating_test",
	"MODE=TEST",
]


